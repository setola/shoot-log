name: Update Mare2 catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mare2-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Restore catalog from previous successful run
        shell: bash
        run: |
          run_id=$(gh run list --workflow mare2-catalog.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name mare2-catalog --dir public/mare2
          else
            echo 'First run: bootstrapping the current year catalog.'
          fi

      - name: Sync current year (at most one Mare2 request per second)
        shell: bash
        run: |
          year=$(TZ=Europe/Rome date +%Y)
          node tools/mare2-importer/index.mjs sync --out=public/mare2 --year="$year" --request-delay-ms=1000 > mare2-sync-report.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('mare2-sync-report.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Mare2 sync\nBuilt: ${report.built}\nSkipped: ${report.skipped}\nFailed: ${report.failed.length}\n\n`);
          for (const failure of report.failed) {
            console.error(`::warning::Mare2 ${failure.matchId}: ${failure.error}`);
          }
          JS

      - name: Validate catalog before preserving or publishing
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import { resolve, dirname } from 'node:path';
          const root = resolve('public/mare2');
          const manifest = JSON.parse(readFileSync(resolve(root, 'manifest.json'), 'utf8'));
          if (!manifest.matches?.length) throw new Error('Refusing to deploy an empty Mare2 catalog');
          for (const entry of manifest.matches) {
            for (const url of [entry.matchUrl, entry.snapshotUrl]) {
              if (!url || !existsSync(resolve(root, url))) throw new Error(`Missing catalog file: ${url}`);
            }
            const matchPath = resolve(root, entry.matchUrl);
            const match = JSON.parse(readFileSync(matchPath, 'utf8'));
            for (const page of match.pages ?? []) {
              if (!existsSync(resolve(dirname(matchPath), page.url))) throw new Error(`Missing image: ${page.url}`);
            }
          }
          console.log(`Validated ${manifest.matches.length} catalog matches`);
          JS

      # Save BEFORE deployment: even if Cloudflare is temporarily unavailable,
      # this artifact is available for manual recovery. The next automatic run
      # still restores only from the most recent successful workflow run.
      - name: Preserve complete catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mare2-catalog
          path: public/mare2
          if-no-files-found: error
          retention-days: 90

      - name: Publish catalog to Cloudflare Pages
        run: npm run mare2:deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
